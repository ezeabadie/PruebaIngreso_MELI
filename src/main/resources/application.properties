# ========================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ========================================

# Nombre de la aplicación
spring.application.name=mutant-detection-api

# ========================================
# CONFIGURACIÓN DEL SERVIDOR
# ========================================
server.port=8080

# ========================================
# CONFIGURACIÓN DE BASE DE DATOS H2
# ========================================
# H2 es una base de datos en memoria perfecta para desarrollo y testing

# URL de conexión (en memoria, se borra al reiniciar)
spring.datasource.url=jdbc:h2:mem:testdb

# Driver de H2
spring.datasource.driverClassName=org.h2.Driver

# Credenciales (usuario/password por defecto)
spring.datasource.username=sa
spring.datasource.password=

# ========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ========================================
# Crear/actualizar esquema automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (útil para debug)
spring.jpa.show-sql=true

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ========================================
# CONSOLA H2 (Interface Web)
# ========================================
# Habilitar consola web de H2
spring.h2.console.enabled=true

# Ruta de acceso: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# ========================================
# CONFIGURACIÓN DE LOGGING
# ========================================
# Nivel de log para la aplicación
logging.level.org.example=INFO

# Nivel de log para Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# CONFIGURACIÓN DE JACKSON (JSON)
# ========================================
# Formato de fechas en JSON
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# No incluir propiedades null en respuestas JSON
spring.jackson.default-property-inclusion=non_null

# ========================================
# ========================================
# SWAGGER/OPENAPI
# ========================================
# Ruta de Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

